name: Validate administrative CMS

on:
  push:
    branches: [codex/kambas-admin-cms]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked application dependencies
        run: |
          npm install --global bun@1.4.3
          bun install --frozen-lockfile
      - name: Check migration logic without credentials or network
        run: node --test scripts/legacy-media.test.mjs
      - name: Preserve creation dates when saving profiles
        run: bun test tests/creator-save.test.ts
      - name: Check application types
        run: bun run lint
      - name: Build production bundle
        run: bun run build
      - name: Compare the approved original rendering
        run: |
          mkdir -p .baseline
          git archive a0c9245a734db6e3cdee071b133a5126a29c3c3b src firebase-applet-config.json | tar -x -C .baseline
          bun test tests/default-ui.test.tsx tests/content-model.test.ts
      - name: Install isolated security test tooling
        run: |
          bun add --dev @firebase/rules-unit-testing firebase-tools
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
      - name: Verify database and media permissions in emulators
        run: bunx firebase emulators:exec --project demo-kambas-cms --only firestore,storage 'node --test tests/firestore-rules.test.mjs'
      - name: Retain the verified application
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: kambas-admin-cms
          path: dist/
          if-no-files-found: error
          retention-days: 7
